name: Portable Windows build

# Builds the 64-bit Windows desktop app as a portable download (no installer) and publishes it
# as the `portable-latest` release of this repository, replacing the previous one.
on:
  push:
    branches: [custom-action-shortcuts]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: build (windows x64 portable)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Link the C runtime statically so the .exe runs on a clean Windows 10 without the
      # Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      # The compositor's shaders must build under DX12's FXC (the compiler GeForce/Intel laptops
      # use): a shader FXC rejects leaves every layer composited on the CPU. Run on DX12's
      # software adapter (WARP), which compiles with FXC.
      - name: GPU compositor builds under DX12 (FXC)
        run: cargo test --locked -p photocraft-gpu --test it compositor_builds
        shell: bash
        env:
          WGPU_BACKEND: dx12
          PHOTOCRAFT_TEST_FALLBACK_ADAPTER: "1"

      # GPU results against the CPU compositor on WARP: reported, not blocking the download.
      - name: GPU/CPU parity on DX12 (informational)
        continue-on-error: true
        run: cargo test --locked -p photocraft-gpu --test it parity
        shell: bash
        env:
          WGPU_BACKEND: dx12
          PHOTOCRAFT_TEST_FALLBACK_ADAPTER: "1"

      # Microsoft's DXC shader compiler, shipped beside the .exe: the app uses it instead of FXC,
      # which took ~20 s to build the compositor's shaders at every start on a dual-core laptop.
      # A failed download leaves FXC (the build still publishes).
      - name: Fetch DXC
        id: dxc
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dxc
          gh release download v1.8.2502 -R microsoft/DirectXShaderCompiler -p 'dxc_2*.zip' -D dxc \
            || gh release download -R microsoft/DirectXShaderCompiler -p 'dxc_2*.zip' -D dxc
          (cd dxc && 7z x -y dxc_*.zip > /dev/null)
          test -f dxc/bin/x64/dxcompiler.dll
          ls dxc/bin/x64

      # The compositor must also build under DXC, as the app will use it.
      - name: GPU compositor builds under DX12 (DXC)
        if: steps.dxc.outcome == 'success'
        run: |
          export PATH="$PWD/dxc/bin/x64:$PATH"
          cargo test --locked -p photocraft-gpu --test it compositor_builds
        shell: bash
        env:
          WGPU_BACKEND: dx12
          WGPU_DX12_COMPILER: dxc
          PHOTOCRAFT_TEST_FALLBACK_ADAPTER: "1"

      # Large GPU redraws are drawn in bands over several frames; once the bands are drawn the canvas
      # must match one full redraw. Checked on WARP (informational).
      - name: Banded GPU redraws end exact (informational)
        id: bands
        continue-on-error: true
        run: cargo test --locked -p photocraft-ui-egui --lib -- a_large_gpu_redraw_is_banded_and_ends_exact --nocapture
        shell: bash
        env:
          WGPU_BACKEND: dx12
          PHOTOCRAFT_REQUIRE_GPU_TESTS: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"

      # `heif`: open HEIC/HEIF photos (pure-Rust decoder), as official builds do.
      - name: Build
        run: cargo build --release --locked -p photocraft --features heif
        shell: bash

      - name: Package
        shell: bash
        run: |
          out=PhotoCraft-Portable-win64
          mkdir "$out"
          cp target/release/photocraft.exe "$out/"
          # portable.txt beside the .exe keeps settings in a PhotoCraftData folder next to it.
          cp packaging/windows/portable.txt "$out/"
          # DXC beside the .exe (when it was fetched), with its licences.
          if [ -f dxc/bin/x64/dxcompiler.dll ]; then
            cp dxc/bin/x64/dxcompiler.dll dxc/bin/x64/dxil.dll "$out/"
            for l in dxc/LICENSE*; do [ -f "$l" ] && cp "$l" "$out/DXC-$(basename "$l")"; done
          fi
          # The files at the zip's root: Windows' Extract All already makes a folder named after
          # the zip, so a folder inside it meant extracting twice to reach the .exe.
          (cd "$out" && 7z a -tzip "../$out.zip" ./* > /dev/null)
          cp target/release/photocraft.exe "$out.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhotoCraft-Portable-win64
          # The files themselves: GitHub zips an artifact for download, so uploading the zip
          # gave a zip inside a zip.
          path: PhotoCraft-Portable-win64/

      - name: Publish download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete portable-latest --yes --cleanup-tag || true
          gh release create portable-latest PhotoCraft-Portable-win64.zip PhotoCraft-Portable-win64.exe \
            --target "$SHA" --prerelease --title "PhotoCraft portable (Windows 64-bit)" \
            --notes "Portable Windows 10/11 64-bit build with custom action shortcuts (right-click an action > Custom Shortcut...). Download the .zip and unzip it to keep settings next to the app, or run the .exe on its own."
